title: 'Adam Porkolab — CV'
baseurl: '' # rooton fut
url: 'https://aporkolab.com'

# Nyilvanos ELERHETOSEG-JELZES kapcsoloja. false -> eltunik a hero tetejerol a
# "Available for work" jelveny, es a lablec CTA-jabol kimarad az allaskeresesre utalo
# tagmondat (a technikai tartalom marad). 2026-09-23-tol false: ez az oldal a contact
# info es a GitHub-profil felol EGY kattintasra van barmelyik kollegatol, tehat a
# nyilvanos "keresek allast" jelzes itt kockazat. Ha ujra keresel, az erre valo eszkoz
# a LinkedIn CSAK RECRUITEREKNEK latszo "Open to Work"-je, nem ez a jelveny -- ezt a
# kapcsolot csak akkor billentsd true-ra, ha tudatosan NYILVANOSAN is vallalod.
available_for_work: false

# Contact-links hub. SZÁNDÉKOSAN itt, NEM a _data/cv_data.yml-ben: azt a külső CV-
# generátor birtokolja és hetente felülírja (a `contact.bento` minden auto-update
# commitban visszaíródik). A bento.me/adamporkolab 2026-09-23-ra halott — nem 404,
# hanem a linktr.ee főoldalára redirektál, vagyis a látogatót idegen oldalra viszi.
contact_links_url: 'https://links.adamporkolab.com/'

# No theme and no plugins on purpose: _layouts/default.html is self-contained
# (inline CSS/JS) and overrides everything a theme would provide. `theme: minima`
# and the `sass:` block were left over from the github-pages setup — nothing in
# the repo referenced them and there is not a single .scss file.

plugins:
  - jekyll-feed # /feed.xml; see the note in the Gemfile

# Jekyll CONCATENATES its own DEFAULT_EXCLUDES (.jekyll-cache, Gemfile, node_modules,
# vendor/bundle/, …) onto this list, so only site-specific paths belong here.
exclude:
  - cloudflare-worker/
  - lighthouse-report.report.html
  - lighthouse-report.report.json
  - lighthouse-report2.json
