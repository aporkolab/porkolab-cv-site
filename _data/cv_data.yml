summary:
  de: 'Senior Full-Stack-Engineer (Java / Spring Boot / Angular) beim größten Online-Rechnungsanbieter
    Ungarns, einem Unternehmen der Visma-Gruppe. Ich arbeite an zentralen Rechnungsdiensten:
    steuerliche und regulatorische Validierung sowie die APIs, die unsere Partner-
    und Buchhaltungssysteme aufrufen.

    Davor habe ich zwei Jahre bei der Deutschen Telekom an einem Rechnungsverarbeitungssystem
    für 13 EU-Länder mit jeweils eigenen Steuerregeln gearbeitet. Ich habe Microservices
    mit Saga- und Outbox-Mustern gebaut und Legacy-Monolithen in domänengetriebene
    Module zerlegt. In der Softwareentwicklung seit 2021, in Enterprise-Teams seit
    2024.

    Ich kam über die Linguistik zum Programmieren (Promotion, summa cum laude), und
    die Gewohnheit ist geblieben: Ich modelliere die Domäne, bevor ich Code schreibe,
    und dokumentiere, was andere undokumentiert lassen. Mit einem Kollegen habe ich
    ein ungarisch-englisches Linguistik-Wörterbuch erstellt und die Software dafür
    geschrieben. 2026 habe ich Kalliope, ein ungarisches Versanalyseprogramm aus den
    2000ern, aus seiner Delphi-Binärdatei rekonstruiert, die Engine in Java neu gebaut
    und mit dem ursprünglichen Autor als Mitautor veröffentlicht. Sie läuft auch im
    Browser.

    Außerdem schreibe ich spekulative Fiktion auf Englisch und Ungarisch (Finalist
    bei Writers of the Future, 2026).

    Arbeitsstil: Remote-first, async-freundlich, spezifikationsgetrieben. Ich entfalte
    mich am besten bei Take-Home-Aufgaben und tiefgehenden technischen Gesprächen
    statt Live-Coding.

    '
  en: 'Senior full-stack engineer (Java / Spring Boot / Angular) at Hungary''s largest
    online invoicing provider, part of the Visma group. I work on core invoicing services:
    tax and regulatory validation, and the APIs our partner and accounting systems
    call.

    Before that I spent two years at Deutsche Telekom on an invoice-processing system
    covering 13 EU countries, each with its own tax rules. I built microservices with
    Saga and Outbox patterns and broke legacy monoliths into domain-driven modules.
    In software since 2021, in enterprise teams since 2024.

    I came to code from linguistics (PhD, summa cum laude), and the habit stayed:
    I model the domain before I write the code, and I document what others leave undocumented.
    With a colleague I compiled a Hungarian–English dictionary of linguistics, and
    I wrote the software that serves it. In 2026 I reverse-engineered Kalliope, a
    2000s Hungarian verse-scansion program, from its Delphi binary, rebuilt the engine
    in Java and published it with the original author as co-author. It runs in the
    browser too.

    I also write speculative fiction in English and Hungarian (Writers of the Future
    finalist, 2026).

    Work style: Remote-first, async-friendly, written-spec-driven. I perform best
    with take-home challenges and in-depth technical discussions that reveal real
    engineering thinking rather than live coding.

    '
  hu: 'Senior full stack fejlesztő vagyok (Java / Spring Boot / Angular) Magyarország
    legnagyobb online számlázó szolgáltatójánál, amely a Visma-csoport tagja. Core
    számlázási szolgáltatásokon dolgozom: adóügyi és jogszabályi validáción, valamint
    azokon az API-kon, amelyeket a partner- és könyvelőrendszerek hívnak.

    Előtte két évig a Deutsche Telekomnál dolgoztam egy 13 uniós országot kiszolgáló
    számlafeldolgozó rendszeren, ahol minden országnak saját adószabályai vannak.
    Saga és Outbox mintájú mikroszolgáltatásokat építettem, és legacy monolitokat
    bontottam domainalapú modulokra. 2021 óta vagyok a szoftverfejlesztésben, 2024
    óta nagyvállalati csapatokban.

    A nyelvészet felől jöttem a kódhoz (PhD, summa cum laude), és a szokás megmaradt:
    előbb modellezem a domaint, csak utána írok kódot, és dokumentálom, amit mások
    dokumentálatlanul hagynak. Egy kollégámmal magyar–angol nyelvészeti szakszótárt
    állítottunk össze, a hozzá tartozó szoftvert én írtam. 2026-ban a Delphi binárisából
    visszafejtettem a Kalliopét, egy 2000-es évekbeli magyar verselemző programot,
    a motorját Javában újraépítettem, és az eredeti szerzővel társszerzőként publikáltuk.
    Böngészőben is fut.

    Spekulatív fikciót is írok, magyarul és angolul (Writers of the Future-döntős,
    2026).

    Távmunkát és írásos egyeztetést preferálok a meetingek helyett. Interjún szívesebben
    oldok meg házi feladatot, mint live coding feladatot.

    '
