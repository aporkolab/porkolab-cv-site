# EGYSZERI takarito munkafolyamat (2026-08-26).
#
# Egy 2026-08-09 07:00-kor indult "Deploy Jekyll" futas QUEUED allapotban
# ragadt, es 17 napon at fogva tartotta a "pages" concurrency-zarat. Minden
# azota inditott telepites moge sorolodott, majd a kovetkezo erkezesekor
# megszakadt — build-hiba nelkul, nemaan. Emiatt 2026-08-09 ota egyetlen
# valtoztatas sem jelent meg az oldalon.
#
# Kivulrol a futast csak `actions: write` jogu API-token tudja leloni; a
# szerveren csak SSH-kulcs van, az viszont CSAK git-muveletekre jo. Viszont
# maga az Actions kap automatikusan tokent — ez a munkafolyamat azzal lo.
#
# Ha lefutott: ez a fajl TOROLHETO.
name: Zombi futas lelovese

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/zombi-lelovese.yml']

permissions:
  actions: write

jobs:
  lelo:
    runs-on: ubuntu-latest
    steps:
      - name: A beragadt futas leallitasa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: '31300150934'
        run: |
          set -u
          api() { curl -sS -X "$1" -o /tmp/out -w '%{http_code}' \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID$2"; }

          echo "Allapot elotte:"
          api GET "" >/dev/null; python3 -c "import json;d=json.load(open('/tmp/out'));print(' ',d['created_at'],d['status'],d['conclusion'])"

          echo "1) sima cancel..."
          KOD=$(api POST "/cancel"); echo "   HTTP $KOD"; cat /tmp/out | head -c 300; echo

          sleep 20
          api GET "" >/dev/null
          ALLAPOT=$(python3 -c "import json;print(json.load(open('/tmp/out'))['status'])")
          echo "   allapot: $ALLAPOT"

          if [ "$ALLAPOT" != "completed" ]; then
            echo "2) force-cancel (a sima nem vitte el)..."
            KOD=$(api POST "/force-cancel"); echo "   HTTP $KOD"; cat /tmp/out | head -c 300; echo
            sleep 20
            api GET "" >/dev/null
            ALLAPOT=$(python3 -c "import json;print(json.load(open('/tmp/out'))['status'])")
          fi

          echo "Vegallapot: $ALLAPOT"
          [ "$ALLAPOT" = "completed" ] && echo "SIKER: a zar felszabadult." \
            || { echo "A futas MEG MINDIG nem completed."; exit 1; }
