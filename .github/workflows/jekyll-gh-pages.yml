# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# 2026-08-26: ebben a csoportban egy 2026-08-09 07:00-kor indult futas
# QUEUED allapotban ragadt, es 17 napon at fogva tartotta a zarat: minden
# ujabb telepites moge sorolodott, majd a kovetkezo erkezesekor megszakadt
# — build-hiba nelkul, nemaan. Tunet: sok egymas utani "cancelled" futas
# NULLA jobbal (el sem indultak), es az oldalon semmi nem frissul.
# A beragadt futas azota lelove, a csoportnev visszaallitva szabvanyosra.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Validate _data YAML (strip generator debug preamble)
        run: ruby .github/scripts/validate-data-yaml.rb _data/*.yml
      # Built from this repo's Gemfile (Jekyll 4.x), not GitHub's frozen
      # github-pages bundle, which is stuck on Jekyll 3.10.
      - name: Build with Jekyll
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production
      - name: Check for unresolved localized fields
        run: .github/scripts/check-localized-leaks.sh _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
