# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate _data YAML (strip generator debug preamble)
        run: |
          # The external CV generator sometimes leaks its stdout debug output into
          # _data/*.yml, which kills the whole Pages build. Parse as-is; only if that
          # fails, drop the leading noise lines until the file parses as a mapping
          # again. Build-time only, the committed file is untouched.
          for f in _data/*.yml; do
            ruby -ryaml -e '
              NOISE = /\A(?:===|[A-Z][A-Z0-9_]{2,}\s*:|Traceback\b)/
              path = ARGV[0]
              def parse(src)
                doc = YAML.unsafe_load(src)
                doc.is_a?(Hash) ? doc : nil
              rescue Psych::SyntaxError
                nil
              end
              src = File.read(path)
              unless parse(src) && src.lines.first !~ NOISE
                lines = src.lines
                limit = [lines.size - 1, 50].min
                cut = (1..limit).find { |n| lines[n] !~ NOISE && parse(lines[n..].join) }
                unless cut
                  warn "::error file=#{path}::Invalid YAML and no recognizable debug preamble in the first #{limit} lines"
                  exit 1
                end
                File.write(path, lines[cut..].join)
                warn "::warning file=#{path}::Stripped #{cut} non-YAML preamble line(s) written by the CV generator. Fix the generator: it must not write debug output to the stream it redirects into this file."
              end
            ' "$f" || exit 1
          done
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
